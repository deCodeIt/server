name: Build Custom Image

on:
  workflow_dispatch:
  push:
    branches: [fix/local-audio-pulse-fallback]

env:
  BASE_IMAGE_VERSION: "1.5.3"
  MASS_VERSION: "2.10.0b0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel
        run: |
          pip install build
          # Set version for the wheel
          sed -i 's/^version = .*/version = "'$MASS_VERSION'"/' pyproject.toml
          python -m build --wheel
          ls dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          file: Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/server:patched
          push: true
          build-args: |
            MASS_VERSION=${{ env.MASS_VERSION }}
            BASE_IMAGE_VERSION=${{ env.BASE_IMAGE_VERSION }}
